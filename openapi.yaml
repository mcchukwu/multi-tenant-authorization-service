openapi: 3.1.0
info:
  title: Multi-Tenant Authorization Service (MTAS)
  version: 1.0.0
  description: |
    RBAC and session-management backend for isolated tenant organizations. The service
    exposes two token types:

    * **Access token**: an opaque, server-issued token (NOT a JWT) returned in the
      response body of `POST /v1/auth/login`, `POST /v1/auth/register`, and
      `POST /v1/auth/refresh`. Send it as `Authorization: Bearer <token>`. It is hashed
      (SHA-256) in the database and can be revoked immediately by revoking its session.
    * **Refresh token**: issued as an `HttpOnly` cookie named `refresh_token`
      (Path `/v1/auth`, `Secure`, `SameSite=Strict`). It rotates on every use; replaying
      a revoked refresh token revokes the entire token family.

    **Cookie-based refresh flow and double-submit CSRF.** `POST /v1/auth/refresh` is the
    only endpoint that authenticates via a cookie rather than the Authorization header,
    and it is protected by a double-submit CSRF token:

    1. `POST /v1/auth/login` (or `/register`) sets two cookies: `refresh_token`
       (`HttpOnly`) and `csrf_token` (JS-readable, same `Path`/`Secure`/`SameSite`).
    2. To refresh, the client must send both cookies **and** echo the `csrf_token`
       cookie's value in the `X-CSRF-Token` header.
    3. The server compares cookie value and header with a constant-time compare
       (`subtle.ConstantTimeCompare`). A missing or mismatched header returns
       `403 {"error": {"code": "csrf_check_failed"}}` before any token validation runs.
    4. On success both cookies are re-issued (rotated), and a fresh access token is
       returned in the body.

    Conventional OpenAPI cookie-auth tooling cannot model double-submit CSRF, hence this
    prose description. Rate limiting: pre-tenant auth endpoints (`login`, `register`,
    `refresh`, invitation accept) are limited per client IP (5 rps, burst 10); all
    `{org_id}`-scoped routes are limited per organization (5 rps, burst 10). Every
    response carries no `request_id` in the body; a request ID is echoed in the
    `X-Request-ID` response header instead (generated by the RequestLogger middleware if
    the client did not send one).

    All versioned API routes live under `/v1`. Health endpoints (`/health`,
    `/health/live`, `/health/ready`) are unversioned and bypass the middleware stack.
servers:
  - url: http://localhost:6070
    description: Local development server; the port is configured by the APP_PORT environment variable (default in .env.example is 6070).
tags:
  - name: Auth
    description: Pre-tenant authentication (login, register, refresh, logout).
  - name: Sessions
    description: Device/session management for the authenticated user.
  - name: Organizations
    description: Tenant organization CRUD and per-user org listing.
  - name: Members
    description: Membership, invitations, and role assignment within an organization.
  - name: Roles
    description: Read-only role catalog per organization.
  - name: Audit
    description: Audit log of business events and the authorization decision trail.
  - name: Health
    description: Liveness, readiness, and aggregate health.
security: []

paths:
  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      operationId: authRegister
      description: |
        Creates a user, their personal organization (`"Ada's Workspace"`, type `personal`),
        an owner membership, and an initial session, all in one transaction. Returns an
        access token in the body and sets the `refresh_token` + `csrf_token` cookies.

        Rate limited per client IP (5 rps, burst 10). No authentication required.

        `last_name` is optional (validation `omitempty`) and stored as NULL when
        omitted; the `users.last_name` column is nullable, matching the request
        validation, so registration succeeds with 201 either way.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example:
              email: ada@example.com
              password: Sup3rSecret!123
              first_name: Ada
              last_name: Lovelace
      responses:
        '201':
          description: Account created; Set-Cookie headers carry refresh_token and csrf_token.
          headers:
            Set-Cookie:
              description: refresh_token (HttpOnly) and csrf_token (JS-readable) cookies, Path=/v1/auth, Secure, SameSite=Strict.
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RegisterResponse' }
              example:
                success: true
                message: account created
                data:
                  access_token: w6xVmFb8nQ2zKpL9rT3uYgH5jN7sM4dC
                  expires_at: '2026-08-30T15:41:00Z'
                  user:
                    id: 0a8b1c2d-3e4f-5a6b-7c8d-9e0f1a2b3c4d
                    email: ada@example.com
                    phone: ''
                    first_name: Ada
                    last_name: Lovelace
                  organization:
                    id: 1b9c2d3e-4f5a-6b7c-8d9e-0f1a2b3c4d5e
                    name: Ada's Workspace
                    type: personal
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email or phone already registered (DB UNIQUE constraint).
          content:
            application/json:
              examples:
                email_taken:
                  value:
                    success: false
                    error: { code: email_already_exists, message: email already exists }
                phone_taken:
                  value:
                    success: false
                    error: { code: phone_already_exists, message: phone already exists }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email or phone
      operationId: authLogin
      description: |
        Verifies credentials against the stored argon2id hash, creates a new session, and
        returns an access token in the body while setting the `refresh_token` and
        `csrf_token` cookies.

        Anti-enumeration: an unknown identifier and a wrong password return byte-identical
        responses (`401 invalid_credentials`), and password verification always runs
        against a precomputed dummy hash so response timing does not leak whether a user
        exists. Rate limited per client IP (5 rps, burst 10).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example:
              identifier: ada@example.com
              password: Sup3rSecret!123
      responses:
        '200':
          description: Login successful; Set-Cookie headers carry refresh_token and csrf_token.
          headers:
            Set-Cookie:
              description: refresh_token (HttpOnly) and csrf_token (JS-readable) cookies, Path=/v1/auth, Secure, SameSite=Strict.
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResponse' }
              example:
                success: true
                message: login successful
                data:
                  access_token: s7dUxKp2nQ9cVwYh4tR8jLm6zB3gFaN1
                  expires_at: '2026-08-30T15:41:00Z'
                  user:
                    id: 0a8b1c2d-3e4f-5a6b-7c8d-9e0f1a2b3c4d
                    email: ada@example.com
                    phone: ''
                    first_name: Ada
                    last_name: Lovelace
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid credentials. Identical body whether the identifier is unknown or the password is wrong.
          content:
            application/json:
              example:
                success: false
                error: { code: invalid_credentials, message: invalid email or password }
        '403':
          description: Account is not `active` (suspended/deleted). Login is refused with a distinct code so the client can show the right message.
          content:
            application/json:
              example:
                success: false
                error: { code: user_suspended, message: user suspended }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token
      operationId: authRefresh
      description: |
        Exchanges the `refresh_token` cookie for a new access token, rotating the refresh
        token and re-issuing the CSRF cookie. No `Authorization` header is used; this
        endpoint authenticates with the refresh cookie, which is why it is the one route
        protected by double-submit CSRF.

        Requirements:
        1. `refresh_token` cookie (HttpOnly, Path=/v1/auth), required.
        2. `csrf_token` cookie **and** an `X-CSRF-Token` header carrying the same value.
           The CSRF check runs before any token validation; a missing/mismatched header
           yields `403 csrf_check_failed`.

        Rotation semantics: presenting a refresh token that was already rotated (revoked)
        is treated as replay/theft; the entire token family is revoked (including the
        legitimate rotated token) and `401 invalid_token` is returned. An expired refresh
        token also yields `401 invalid_token`. Rate limited per client IP (5 rps, burst 10).
      responses:
        '200':
          description: Token refreshed; both cookies re-issued (rotated values).
          headers:
            Set-Cookie:
              description: New refresh_token and csrf_token cookies, Path=/v1/auth, Secure, SameSite=Strict.
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RefreshResponse' }
              example:
                success: true
                message: token refreshed
                data:
                  access_token: j4mKp8qW2rT6yU5vN3cXbZ7hL9dSfA0
                  expires_at: '2026-08-30T15:41:00Z'
        '401':
          description: Missing refresh_token cookie, or refresh token unknown/revoked/expired.
          content:
            application/json:
              examples:
                missing_cookie:
                  value:
                    success: false
                    error: { code: missing_token, message: Refresh token is required }
                replay_or_expired:
                  value:
                    success: false
                    error: { code: invalid_token, message: invalid token }
        '403':
          description: 'CSRF check failed: missing or mismatched X-CSRF-Token header.'
          content:
            application/json:
              example:
                success: false
                error: { code: csrf_check_failed, message: CSRF validation failed }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      operationId: authLogout
      description: |
        Revokes exactly the session whose access token is presented, and clears both auth
        cookies. Requires `Authorization: Bearer <access token>` (no CSRF needed; the
        bearer header is never auto-attached by browsers). Returns 204 with no body.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session revoked, cookies cleared, no response body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke every session for the user
      operationId: authLogoutAll
      description: |
        Revokes all sessions belonging to the authenticated user across every device, and
        clears both auth cookies. Returns 204 with no body.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All sessions revoked, cookies cleared, no response body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/sessions:
    get:
      tags: [Sessions]
      summary: List the user's active sessions
      operationId: authListSessions
      description: |
        Lists the authenticated user's live sessions (revoked ones are excluded), newest
        first. Exactly one entry is flagged `current`: the session that issued the
        presented access token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active sessions for the user.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SessionResponse' }
              example:
                success: true
                message: sessions retrieved
                data:
                  - id: 3f2e1d0c-9b8a-7f6e-5d4c-3b2a1f0e9d8c
                    user_agent: Mozilla/5.0 (X11; Linux x86_64)
                    ip_address: 203.0.113.10
                    created_at: '2026-08-30T14:30:00Z'
                    expires_at: '2026-10-01T14:30:00Z'
                    current: true
                  - id: 6a5b4c3d-2e1f-0a9b-8c7d-6e5f4a3b2c1d
                    user_agent: curl/8.5.0
                    ip_address: 198.51.100.22
                    created_at: '2026-08-29T09:12:00Z'
                    expires_at: '2026-09-30T09:12:00Z'
                    current: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/invitations/{token}/accept:
    post:
      tags: [Members]
      summary: Accept an invitation link
      operationId: acceptInvitation
      description: |
        Redeems a link-invitation token and creates the authenticated user's membership in
        the inviting organization, in one transaction (a token cannot be redeemed twice,
        even under concurrent requests). This route is deliberately NOT org-scoped; the
        organization is resolved from the invitation, so it requires authentication only,
        never an authorization permission. Rate limited per client IP (5 rps, burst 10).

        Accepting a second invitation into an organization you already belong to is
        rejected with `409 already_member`; `CreateMembership` translates the memberships
        `UNIQUE(user_id, organization_id)` violation into that code.
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          description: Raw invitation token (the value returned by the invite endpoint).
          schema: { type: string }
          example: Uq7zNp4mR9cVwXy2kT6sBdHjF5gLaW3
      responses:
        '200':
          description: Invitation accepted; data carries the resolved organization ID.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [organization_id]
                        properties:
                          organization_id:
                            type: string
                            format: uuid
              example:
                success: true
                message: invitation accepted
                data:
                  organization_id: 1b9c2d3e-4f5a-6b7c-8d9e-0f1a2b3c4d5e
        '401':
          description: Missing/invalid access token, or invitation token unknown, expired, already accepted, or already revoked.
          content:
            application/json:
              example:
                success: false
                error: { code: invalid_token, message: invalid token }
        '409':
          description: The caller is already an active member of the inviting organization (memberships UNIQUE(user_id, organization_id)).
          content:
            application/json:
              example:
                success: false
                error: { code: already_member, message: user already belongs to organization }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/orgs:
    post:
      tags: [Organizations]
      summary: Create a business organization
      operationId: createOrganization
      description: |
        Creates a new `business`-type organization with the caller as its sole owner
        (owner role membership), cloning the four template roles into the new org. The org
        `type` is never read from the request; `personal` is reachable only through
        registration. Requires authentication only (no `{org_id}` exists to scope against
        yet). Not rate limited.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrgRequest' }
            example:
              name: Ada's Company
      responses:
        '201':
          description: Organization created with the caller as owner.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Organization' }
              example:
                success: true
                message: organization created
                data:
                  id: 1b9c2d3e-4f5a-6b7c-8d9e-0f1a2b3c4d5e
                  name: Ada's Company
                  type: business
                  status: active
                  created_at: '2026-08-30T15:30:00Z'
                  updated_at: '2026-08-30T15:30:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/me/organizations:
    get:
      tags: [Organizations]
      summary: List organizations the caller belongs to
      operationId: listMyOrganizations
      description: |
        Lists every non-deleted organization the authenticated user has an active membership
        in, oldest first. Cross-tenant by nature, so it requires authentication only (no
        single `{org_id}` to scope against). Not rate limited.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organizations the caller is a member of.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Organization' }
              example:
                success: true
                message: organizations retrieved
                data:
                  - id: 0a8b1c2d-3e4f-5a6b-7c8d-9e0f1a2b3c4d
                    name: Ada's Workspace
                    type: personal
                    status: active
                    created_at: '2026-08-30T15:10:00Z'
                    updated_at: '2026-08-30T15:10:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/orgs/{org_id}:
    get:
      tags: [Organizations]
      summary: Get organization details
      operationId: getOrganization
      description: |
        Returns one organization. Requires authentication **and** the `org.view`
        permission within that organization. The Authz middleware validates the caller's
        active membership in `{org_id}` before the handler runs, so a non-member gets
        `403 forbidden`, indistinguishable for a real foreign org and a random org ID
        (anti-enumeration). Rate limited per organization (5 rps, burst 10).
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/OrgID' }
      responses:
        '200':
          description: Organization details.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Organization' }
              example:
                success: true
                message: organization retrieved
                data:
                  id: 1b9c2d3e-4f5a-6b7c-8d9e-0f1a2b3c4d5e
                  name: Ada's Company
                  type: business
                  status: active
                  created_at: '2026-08-30T15:30:00Z'
                  updated_at: '2026-08-30T15:30:00Z'
        '400':
          $ref: '#/components/responses/InvalidOrgID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Organization not found (soft-deleted, or deleted since the membership check).
          content:
            application/json:
              example:
                success: false
                error: { code: organization_not_found, message: organization not found }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Organizations]
      summary: Update organization name
      operationId: updateOrganization
      description: |
        Renames the organization (name is the only updatable field; slug is never written
        by this API). Requires authentication and the `org.update` permission. Rate limited
        per organization (5 rps, burst 10).
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/OrgID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOrgRequest' }
            example:
              name: Ada's Company (Renamed)
      responses:
        '200':
          description: Updated organization.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Organization' }
              example:
                success: true
                message: organization updated
                data:
                  id: 1b9c2d3e-4f5a-6b7c-8d9e-0f1a2b3c4d5e
                  name: Ada's Company (Renamed)
                  type: business
                  status: active
                  created_at: '2026-08-30T15:30:00Z'
                  updated_at: '2026-08-30T15:31:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrgNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Organizations]
      summary: Delete an organization
      operationId: deleteOrganization
      description: |
        Soft-deletes the organization (status → `deleted`); rows are kept so the audit
        trail survives. Requires authentication and the `org.delete` permission. A
        `personal` organization can never be deleted, even by its own owner; the service
        returns `409 cannot_delete_personal_org` after the permission check passes. Returns
        204 with no body. Rate limited per organization (5 rps, burst 10).
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/OrgID' }
      responses:
        '204':
          description: Organization soft-deleted; no response body.
        '400':
          $ref: '#/components/responses/InvalidOrgID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrgNotFound'
        '409':
          description: Personal organizations cannot be deleted.
          content:
            application/json:
              example:
                success: false
                error: { code: cannot_delete_personal_org, message: cannot delete personal organization }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/orgs/{org_id}/members:
    get:
      tags: [Members]
      summary: List organization members
      operationId: listMembers
      description: |
        Lists members of the organization with their role. Requires authentication and the
        `member.view` permission. Member lists are strictly org-scoped: an owner of org A
        cannot list org B's members (403 at the middleware). Rate limited per organization.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/OrgID' }
      responses:
        '200':
          description: Member list.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Member' }
              example:
                success: true
                message: members retrieved
                data:
                  - user_id: 0a8b1c2d-3e4f-5a6b-7c8d-9e0f1a2b3c4d
                    email: ada@example.com
                    first_name: Ada
                    last_name: Lovelace
                    role_id: 7c6b5a49-8d7c-6b5a-4c3b-2a1f9e8d7c6b
                    role_name: owner
                    role_kind: owner
                    status: active
                    joined_at: '2026-08-30T15:30:00Z'
        '400':
          $ref: '#/components/responses/InvalidOrgID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Members]
      summary: Create an invitation link
      operationId: inviteMember
      description: |
        Creates a rotatable link invitation for a role in the organization and returns the
        raw token (stored hashed). Requires authentication and the `member.invite`
        permission. Two service-layer rules sit above the permission check: only an owner
        can invite into the `owner` role (`403 owner_action_restricted` otherwise), and a
        role ID that belongs to a different organization collapses to
        `404 membership_not_found`, indistinguishable from a nonexistent role
        (anti-enumeration). Personal organizations reject all invitations with
        `409 personal_workspace`; the guard runs before any invitation row is created.
        Rate limited per organization.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/OrgID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteRequest' }
            example:
              role_id: 7c6b5a49-8d7c-6b5a-4c3b-2a1f9e8d7c6b
      responses:
        '201':
          description: Invitation created; token is returned once (stored hashed server-side).
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InviteResponse' }
              example:
                success: true
                message: invitation created
                data:
                  token: Uq7zNp4mR9cVwXy2kT6sBdHjF5gLaW3
                  role_id: 7c6b5a49-8d7c-6b5a-4c3b-2a1f9e8d7c6b
                  expires_at: '2026-09-06T15:35:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden (missing `member.invite`), or restricted owner action (inviting into the owner role as a non-owner).
          content:
            application/json:
              examples:
                no_permission:
                  value:
                    success: false
                    error: { code: forbidden, message: You do not have permission to perform this action }
                owner_restricted:
                  value:
                    success: false
                    error: { code: owner_action_restricted, message: owner action restricted }
        '404':
          description: Role ID is not scoped to this organization (indistinguishable from a nonexistent role).
          content:
            application/json:
              example:
                success: false
                error: { code: membership_not_found, message: membership not found }
        '409':
          description: The organization is a personal workspace and does not accept members.
          content:
            application/json:
              example:
                success: false
                error: { code: personal_workspace, message: this is a personal workspace; create a new workspace to invite members }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/orgs/{org_id}/members/{user_id}:
    delete:
      tags: [Members]
      summary: Remove a member
      operationId: removeMember
      description: |
        Removes a member from the organization. Requires authentication and the
        `member.remove` permission, plus two service-layer owner rules: only an owner can
        remove another owner (`403 owner_action_restricted`), and the last owner can never
        be removed (`409 last_owner`). The target user ID is looked up scoped to
        `(organization_id, user_id)`, so a user who belongs to a different org returns
        `404 membership_not_found`, identical to a random UUID (IDOR mitigation). Returns
        204 with no body. Rate limited per organization.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/OrgID' }
        - name: user_id
          in: path
          required: true
          description: Target member's user ID.
          schema: { type: string, format: uuid }
          example: 4e3d2c1b-0a9f-8e7d-6c5b-4a3f2e1d0c9b
      responses:
        '204':
          description: Member removed; no response body.
        '400':
          description: org_id or user_id is not a valid UUID.
          content:
            application/json:
              examples:
                bad_org:
                  value:
                    success: false
                    error: { code: invalid_org_id, message: Invalid organization ID }
                bad_user:
                  value:
                    success: false
                    error: { code: invalid_user_id, message: Invalid user ID }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden (missing `member.remove`), or restricted owner action (non-owner removing an owner).
          content:
            application/json:
              examples:
                no_permission:
                  value:
                    success: false
                    error: { code: forbidden, message: You do not have permission to perform this action }
                owner_restricted:
                  value:
                    success: false
                    error: { code: owner_action_restricted, message: owner action restricted }
        '404':
          description: Target is not a member of this org, indistinguishable from a nonexistent user.
          content:
            application/json:
              example:
                success: false
                error: { code: membership_not_found, message: membership not found }
        '409':
          description: The organization's last owner cannot be removed.
          content:
            application/json:
              example:
                success: false
                error: { code: last_owner, message: last owner cannot be removed }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/orgs/{org_id}/members/{user_id}/role:
    patch:
      tags: [Members]
      summary: Change a member's role
      operationId: assignMemberRole
      description: |
        Assigns a new role to a member. Requires authentication and the
        `member.assign_role` permission, plus service-layer owner rules: only an owner may
        change anyone's owner status, granting **or** revoking the `owner` role, and a
        non-owner gets `403 owner_action_restricted` in either direction. Demoting the last
        owner is blocked with `409 last_owner`. Returns 204 with no body. Rate limited per
        organization.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/OrgID' }
        - name: user_id
          in: path
          required: true
          description: Target member's user ID.
          schema: { type: string, format: uuid }
          example: 4e3d2c1b-0a9f-8e7d-6c5b-4a3f2e1d0c9b
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignRoleRequest' }
            example:
              role_id: 5f4e3d2c-1b0a-9f8e-7d6c-5b4a3f2e1d0c
      responses:
        '204':
          description: Role updated; no response body.
        '400':
          description: Invalid UUID in path/body, or validation failure.
          content:
            application/json:
              examples:
                bad_org:
                  value:
                    success: false
                    error: { code: invalid_org_id, message: Invalid organization ID }
                bad_user:
                  value:
                    success: false
                    error: { code: invalid_user_id, message: Invalid user ID }
                bad_role:
                  value:
                    success: false
                    error: { code: invalid_role_id, message: Invalid role ID }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden (missing `member.assign_role`), or restricted owner action (non-owner granting or revoking the owner role).
          content:
            application/json:
              examples:
                no_permission:
                  value:
                    success: false
                    error: { code: forbidden, message: You do not have permission to perform this action }
                owner_restricted:
                  value:
                    success: false
                    error: { code: owner_action_restricted, message: owner action restricted }
        '404':
          description: Target member not in this org, or role not scoped to this org.
          content:
            application/json:
              example:
                success: false
                error: { code: membership_not_found, message: membership not found }
        '409':
          description: The organization's last owner cannot be demoted.
          content:
            application/json:
              example:
                success: false
                error: { code: last_owner, message: last owner cannot be removed }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/orgs/{org_id}/invitations/{invitation_id}/rotate:
    post:
      tags: [Members]
      summary: Rotate an invitation link
      operationId: rotateInvitation
      description: |
        Revokes an existing active invitation and issues a replacement token for the same
        role; the same revoke-and-reissue pattern as refresh-token rotation. Requires
        authentication and the `member.invite` permission (rotating is conceptually
        "issue a new invite that replaces this one," not a separate capability). The same
        owner-target restriction applies as for creating an invite.

        Response note: the handler constructs `InviteResponse` without a `role_id`, so the
        serialized `role_id` field is present but empty (`""`). Rate limited per
        organization.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/OrgID' }
        - name: invitation_id
          in: path
          required: true
          description: ID of the invitation to rotate.
          schema: { type: string, format: uuid }
          example: 8d7c6b5a-4f3e-2d1c-0b9a-8f7e6d5c4b3a
      responses:
        '200':
          description: Invitation rotated; new token issued.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InviteResponse' }
              example:
                success: true
                message: invitation rotated
                data:
                  token: Kp8mQz2xNv7cRbY5wT4sDfGhJ3lUaM6
                  role_id: ''
                  expires_at: '2026-09-06T15:45:00Z'
        '400':
          description: org_id or invitation_id is not a valid UUID.
          content:
            application/json:
              examples:
                bad_org:
                  value:
                    success: false
                    error: { code: invalid_org_id, message: Invalid organization ID }
                bad_invite:
                  value:
                    success: false
                    error: { code: invalid_invitation_id, message: Invalid invitation ID }
        '401':
          description: Missing/invalid access token, or the invitation is no longer active (already revoked/rotated).
          content:
            application/json:
              examples:
                unauth:
                  value:
                    success: false
                    error: { code: missing_token, message: Authorization header with a bearer token is required }
                inactive:
                  value:
                    success: false
                    error: { code: invalid_token, message: invalid token }
        '403':
          description: Forbidden (missing `member.invite`), or restricted owner action (rotating an owner-role invitation as a non-owner).
          content:
            application/json:
              example:
                success: false
                error: { code: owner_action_restricted, message: owner action restricted }
        '404':
          description: Invitation ID is not scoped to this organization, or does not exist, collapsed to `invitation_not_found` (anti-enumeration).
          content:
            application/json:
              example:
                success: false
                error: { code: invitation_not_found, message: invitation not found }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/orgs/{org_id}/leave:
    post:
      tags: [Members]
      summary: Leave an organization
      operationId: leaveOrganization
      description: |
        Removes the authenticated user's own membership from the organization; the
        self-service counterpart of removing a member. Any active member, any role, can
        leave; the route deliberately carries no permission check beyond authentication
        (Authn + per-org rate limiting only), and the service's own membership lookup
        rejects non-members.

        Service rules: the organization's last owner cannot leave (`409 last_owner`),
        the same min-one-owner guard as Remove/AssignRole. A caller who is not an active
        member of this org (or an org that does not exist) gets
        `404 membership_not_found`, indistinguishable for a foreign org and a random org
        ID (anti-enumeration). Returns 204 with no body. Rate limited per organization.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/OrgID' }
      responses:
        '204':
          description: Membership removed; no response body.
        '400':
          description: org_id is not a valid UUID.
          content:
            application/json:
              example:
                success: false
                error: { code: invalid_org_id, message: Invalid organization ID }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Caller is not an active member of this org (or the org does not exist), indistinguishable (anti-enumeration).
          content:
            application/json:
              example:
                success: false
                error: { code: membership_not_found, message: membership not found }
        '409':
          description: The organization's last owner cannot leave; the min-one-owner invariant applies to Leave as well.
          content:
            application/json:
              example:
                success: false
                error: { code: last_owner, message: last owner cannot be removed }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/orgs/{org_id}/roles:
    get:
      tags: [Roles]
      summary: List the organization's roles
      operationId: listRoles
      description: |
        Lists the roles provisioned for this organization (clones of the four template
        roles: owner, admin, member, viewer). Requires authentication and the `role.view`
        permission. Role administration (create/update/delete) is intentionally not
        implemented. Rate limited per organization.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/OrgID' }
      responses:
        '200':
          description: Roles in the organization.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Role' }
              example:
                success: true
                message: roles retrieved
                data:
                  - id: 7c6b5a49-8d7c-6b5a-4c3b-2a1f9e8d7c6b
                    name: owner
                    kind: owner
                    is_system: true
                    created_at: '2026-08-30T15:30:00Z'
                  - id: 6b5a4938-7c6b-5a49-3b2a-190f8e7d6c5b
                    name: admin
                    kind: admin
                    is_system: true
                    created_at: '2026-08-30T15:30:00Z'
        '400':
          $ref: '#/components/responses/InvalidOrgID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/orgs/{org_id}/audit-logs:
    get:
      tags: [Audit]
      summary: List audit log entries
      operationId: listAuditLogs
      description: |
        Reads back the organization's audit log (business events such as
        `user.registered`, `user.logged_in`, `token.replay_detected`), newest first.
        Requires authentication and the `audit_log.view` permission. Paginated with
        `limit` (default 50, max 200) and `offset` (default 0). Rate limited per
        organization.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/OrgID' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Audit log entries for the organization.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LogEntryView' }
              example:
                success: true
                message: audit logs retrieved
                data:
                  - id: 9a8b7c6d-5e4f-3d2c-1b0a-9f8e7d6c5b4a
                    user_id: 0a8b1c2d-3e4f-5a6b-7c8d-9e0f1a2b3c4d
                    action: user.logged_in
                    entity_type: user
                    entity_id: 0a8b1c2d-3e4f-5a6b-7c8d-9e0f1a2b3c4d
                    metadata: {}
                    ip_address: 203.0.113.10
                    user_agent: curl/8.5.0
                    created_at: '2026-08-30T15:31:00Z'
        '400':
          $ref: '#/components/responses/InvalidOrgID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/orgs/{org_id}/authz-decisions:
    get:
      tags: [Audit]
      summary: List authorization decisions
      operationId: listAuthzDecisions
      description: |
        Reads back the authorization decision trail: every `Authz` middleware check against
        this organization, allowed or denied, with the reason and the exact permission key
        checked. This is the full audit trail behind the "every authorization decision"
        claim. Requires authentication and the `audit_log.view` permission. Paginated with
        `limit` (default 50, max 200) and `offset` (default 0). Rate limited per
        organization.

        Note: `resource_type` / `resource_id` columns exist and are returned, but no
        resource endpoints exist in this build, so they are currently always empty/null.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/OrgID' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Authorization decisions for the organization.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessResponse' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DecisionView' }
              example:
                success: true
                message: authorization decisions retrieved
                data:
                  - id: 1f2e3d4c-5b6a-7988-9a0b-1c2d3e4f5a6b
                    user_id: 0a8b1c2d-3e4f-5a6b-7c8d-9e0f1a2b3c4d
                    permission_key: org.view
                    allowed: true
                    reason: role grants permission
                    created_at: '2026-08-30T15:40:00Z'
                  - id: 2a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
                    user_id: 3c2d1e4f-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                    permission_key: member.invite
                    allowed: false
                    reason: role lacks permission
                    created_at: '2026-08-30T15:41:00Z'
        '400':
          $ref: '#/components/responses/InvalidOrgID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /health:
    get:
      tags: [Health]
      summary: Aggregate health check
      operationId: health
      description: |
        Always returns 200 with a status and timestamp. Served outside `/v1` and bypasses
        the middleware stack.
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              example:
                success: true
                message: service healthy
                data:
                  status: ok
                  time: '2026-08-30T15:45:00Z'

  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: healthLive
      description: |
        Returns 200 while the process is running (no data payload). Bypasses the
        middleware stack.
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              example:
                success: true
                message: service alive

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      operationId: healthReady
      description: |
        Returns 200 once the application has started serving and the database answers a
        ping within 3 seconds. Returns 503 while starting up or if the DB ping fails.
        Bypasses the middleware stack.
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              example:
                success: true
                message: service ready
        '503':
          description: Not ready (starting up, or database unreachable).
          content:
            application/json:
              examples:
                starting:
                  value:
                    success: false
                    error: { code: service_unavailable, message: service unavailable }
                db_down:
                  value:
                    success: false
                    error: { code: service_unavailable, message: database unavailable }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Opaque access token from login/register/refresh, sent as `Authorization: Bearer <token>`. NOT a JWT; server-issued and revocable.'

  parameters:
    OrgID:
      name: org_id
      in: path
      required: true
      description: Organization (tenant) ID. The Authz middleware validates the caller's active membership in this org before any handler runs.
      schema: { type: string, format: uuid }
      example: 1b9c2d3e-4f5a-6b7c-8d9e-0f1a2b3c4d5e
    Limit:
      name: limit
      in: query
      description: Maximum number of entries (1–200; default 50). Invalid values fall back to the default.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      example: 50
    Offset:
      name: offset
      in: query
      description: Number of entries to skip (>= 0; default 0). Negative values fall back to 0.
      schema: { type: integer, minimum: 0, default: 0 }
      example: 0

  responses:
    Unauthorized:
      description: 'Not authenticated: missing Authorization header (`missing_token`), or the presented access token is unknown, revoked, or expired (`invalid_token`).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            missing_token:
              value:
                success: false
                error: { code: missing_token, message: Authorization header with a bearer token is required }
            invalid_token:
              value:
                success: false
                error: { code: invalid_token, message: Invalid or expired session }
    Forbidden:
      description: Authenticated, but the caller lacks the route's permission (or is not an active member of the org). Authz middleware records the decision (allowed=false) in the decision trail before rejecting.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: forbidden, message: You do not have permission to perform this action }
    InvalidOrgID:
      description: The {org_id} path parameter is not a valid UUID (rejected by the Authz middleware).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: invalid_org_id, message: Invalid organization ID }
    OrgNotFound:
      description: Organization not found (does not exist or is soft-deleted).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: organization_not_found, message: organization not found }
    ValidationError:
      description: Malformed request body or validation failure. `fields` is keyed by Go struct field name (e.g. `Email`, `Password`, `FirstName`), and `code` is `invalid_request` or `invalid_request_body` for malformed JSON, `validation_error` for field failures.
      content:
        application/json:
          schema:
            anyOf:
              - { $ref: '#/components/schemas/ErrorResponse' }
              - { $ref: '#/components/schemas/ValidationErrorResponse' }
          examples:
            invalid_request:
              value:
                success: false
                error: { code: invalid_request, message: Invalid request body }
            invalid_request_body:
              value:
                success: false
                error: { code: invalid_request_body, message: request body is invalid }
            validation_error:
              value:
                success: false
                error:
                  code: validation_error
                  message: validation failed
                  fields:
                    Password: value is too short
                    FirstName: field is required
    RateLimited:
      description: 'Token-bucket limit exceeded (5 rps, burst 10; keyed per client IP on auth routes, per org ID on org-scoped routes). Includes `Retry-After: 60`; successful requests on limited routes expose `X-RateLimit-Remaining`.'
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: rate_limited, message: 'Too many requests, please try again later' }
    InternalError:
      description: Unexpected server error. Either `internal_server_error` (apperrors default) or `internal_error` (middleware/handler path).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error: { code: internal_server_error, message: internal server error }

  schemas:
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
          description: Human-readable result message (omitted on 204 responses, which have no body).
        data:
          description: Endpoint-specific payload (omitted when empty).
      example:
        success: true
        message: login successful
        data: {}

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code (e.g. `invalid_credentials`, `last_owner`).
        message:
          type: string
          description: Human-readable error message.

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorDetail'
      description: Envelope for all non-validation errors. No request_id appears in the body; see the `X-Request-ID` response header.

    ValidationErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message, fields]
          properties:
            code:
              type: string
              const: validation_error
            message:
              type: string
              const: validation failed
            fields:
              type: object
              additionalProperties: { type: string }
              description: Per-field failure reasons, keyed by Go struct field name (e.g. `Email`, `Password`, `FirstName`, `RoleID`).
      description: Envelope for 400 validation failures.

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email address. Optional only if `phone` is provided; at least one is required.
          example: ada@example.com
        phone:
          type: string
          description: E.164 phone number (e.g. +2348012345678). Optional only if `email` is provided; at least one is required.
          example: '+2348012345678'
        password:
          type: string
          minLength: 8
          description: Password, hashed server-side with argon2id. Minimum 8 characters.
          example: Sup3rSecret!123
        first_name:
          type: string
          description: Required.
          example: Ada
        last_name:
          type: string
          description: Optional; stored as NULL when omitted (the users.last_name column is nullable, matching the request validation).
          example: Lovelace
      required: [password, first_name]

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email address or (optionally country-prefixed) phone number. Normalized server-side with region 'NG'.
          example: ada@example.com
        password:
          type: string
          minLength: 4
          maxLength: 72
          example: Sup3rSecret!123

    UserInfo:
      type: object
      required: [id, email, phone, first_name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, description: Empty string when the user registered with a phone only. }
        phone: { type: string, description: Empty string when the user registered with an email only. }
        first_name: { type: string }
        last_name: { type: string, description: Omitted when empty (omitempty). }

    OrganizationInfo:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type:
          type: string
          enum: [personal, business]
          description: 'personal orgs are created once per user at registration; business orgs via POST /v1/orgs.'

    RegisterResponse:
      type: object
      required: [access_token, expires_at, user, organization]
      properties:
        access_token:
          type: string
          description: 'Opaque access token (256-bit random, base64url). Send as `Authorization: Bearer <token>`.'
        expires_at:
          type: string
          format: date-time
          description: Access token expiry (JWT_ACCESS_TTL after issue).
        user: { $ref: '#/components/schemas/UserInfo' }
        organization: { $ref: '#/components/schemas/OrganizationInfo' }

    LoginResponse:
      type: object
      required: [access_token, expires_at, user]
      properties:
        access_token: { type: string, description: Opaque access token. }
        expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/UserInfo' }

    RefreshResponse:
      type: object
      required: [access_token, expires_at]
      properties:
        access_token: { type: string, description: Fresh opaque access token; the previous one is revoked by rotation. }
        expires_at: { type: string, format: date-time }

    SessionResponse:
      type: object
      required: [id, user_agent, ip_address, created_at, expires_at, current]
      properties:
        id: { type: string, format: uuid, description: Session ID (not a token). }
        user_agent: { type: string }
        ip_address: { type: string, description: Client IP as recorded at session creation. }
        created_at: { type: string, format: date-time, description: Not updated on rotation. }
        expires_at: { type: string, format: date-time, description: Refresh token expiry. }
        current:
          type: boolean
          description: 'True for exactly one session: the one the presented access token belongs to.'

    Organization:
      type: object
      required: [id, name, type, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [personal, business] }
        slug:
          type: [string, 'null']
          description: Always null; no code path writes the slug in this build (omitempty).
        status: { type: string, enum: [active, suspended, deleted] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateOrgRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Ada's Company }

    UpdateOrgRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Ada's Company (Renamed) }

    Member:
      type: object
      required: [user_id, email, first_name, last_name, role_id, role_name, role_kind, status, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        role_id: { type: string, format: uuid, description: Org-scoped role ID. }
        role_name: { type: string }
        role_kind: { type: string, enum: [owner, admin, member, viewer, custom], description: Stable identifier invariant logic keys off; names are editable. }
        status: { type: string, enum: [active, invited, suspended] }
        joined_at: { type: string, format: date-time }

    InviteRequest:
      type: object
      required: [role_id]
      properties:
        role_id:
          type: string
          format: uuid
          description: Role to grant on accept. Must belong to this organization (a foreign role ID collapses to 404).
          example: 7c6b5a49-8d7c-6b5a-4c3b-2a1f9e8d7c6b

    AssignRoleRequest:
      type: object
      required: [role_id]
      properties:
        role_id:
          type: string
          format: uuid
          description: New role. Must belong to this organization.
          example: 5f4e3d2c-1b0a-9f8e-7d6c-5b4a3f2e1d0c

    InviteResponse:
      type: object
      required: [token, role_id, expires_at]
      properties:
        token:
          type: string
          description: Raw invitation token, returned once; only its SHA-256 hash is stored. Accept via POST /v1/auth/invitations/{token}/accept.
          example: Uq7zNp4mR9cVwXy2kT6sBdHjF5gLaW3
        role_id:
          type: string
          description: "The invited role's ID. Note: the rotate endpoint leaves this empty (\"\")."
          example: 7c6b5a49-8d7c-6b5a-4c3b-2a1f9e8d7c6b
        expires_at: { type: string, format: date-time, description: 7 days after creation. }

    Role:
      type: object
      required: [id, name, kind, is_system, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [owner, admin, member, viewer, custom] }
        is_system: { type: boolean, description: True for the seeded default roles (protected from deletion in principle; no role-deletion endpoint exists yet). }
        created_at: { type: string, format: date-time }

    LogEntryView:
      type: object
      required: [id, action, entity_type, ip_address, user_agent, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: [string, 'null'], format: uuid, description: Omitted when null (e.g. system-originated events). }
        action:
          type: string
          description: Event name, e.g. user.registered, user.logged_in, token.replay_detected.
          example: user.logged_in
        entity_type: { type: string }
        entity_id: { type: [string, 'null'], format: uuid, description: Omitted when null. }
        metadata: { type: object, description: Omitted when empty; may hold e.g. token_family_id on replay events. }
        ip_address: { type: string }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }

    DecisionView:
      type: object
      required: [id, permission_key, allowed, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: [string, 'null'], format: uuid, description: Omitted when null. }
        permission_key:
          type: string
          description: The exact permission checked (denormalized snapshot, not a FK).
          example: member.invite
        resource_type:
          type: [string, 'null']
          description: Always null/omitted in this build; no resource endpoints exist, so no code path writes a resource type.
        resource_id:
          type: [string, 'null']
          format: uuid
          description: Always null/omitted in this build, for the same reason as resource_type.
        allowed: { type: boolean, description: Every check is recorded, allowed and denied. }
        reason:
          type: string
          description: 'role grants permission or role lacks permission.'
        created_at: { type: string, format: date-time }
